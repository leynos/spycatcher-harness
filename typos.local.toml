# Repository-specific exceptions to the shared en-GB-oxendict policy.

schema = 1

[oxford]
stems = []

[words]
accepted = []

[words.corrections]

[patterns]
ignore = [
  # "mold" names the linker (https://github.com/rui314/mold) in these
  # contexts only; the mould correction stays active elsewhere.
  "-fuse-ld=mold",
  "mold linker",
  "Cranelift \\+ mold",
  "Cranelift and mold",
  "`mold`",
  # Preserve formal upstream documentation names across line wrapping.
  'Azure\s+Architecture\s+Center\s+\|\s+Microsoft\s+Learn',
  'GitHub\s+Flavored\s+Markdown',
]

[files]
exclude = []
