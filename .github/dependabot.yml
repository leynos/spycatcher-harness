version: 2
updates:
  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    directory: "/"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

  # Enable version updates for Cargo
  - package-ecosystem: "cargo"
    directory: "/"
    groups:
      # The rstest-bdd crates release in lockstep and one bumped alone does not
      # build. Cargo counts a 0.x minor as a major, which the catch-all leaves
      # ungrouped, so this group keeps the family in one pull request. It must
      # precede the catch-all: Dependabot uses the first group that matches.
      rstest-bdd:
        patterns:
          - "rstest-bdd*"
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "cargo"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14
